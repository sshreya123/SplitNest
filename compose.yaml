services:
  database:
    image: postgres:17-alpine
    container_name: splitnest-database
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - splitnest_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: splitnest-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}

    ports:
      - "8001:8001"

    depends_on:
      database:
        condition: service_healthy

    command: >
      sh -c "alembic upgrade head &&
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8001"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend

      args:
        VITE_API_URL: http://localhost:8001/api/v1

    container_name: splitnest-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost/health > /dev/null
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  splitnest_postgres_data: